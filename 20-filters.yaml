- name: filters
  hosts: local
  connection: local
  tasks:
  - name: handle unverified variables
    ansible.builtin.debug:
      msg: "Hello {{ person | default('Kalyan') }}"

  - name: convert string to list
    vars:
      fruits: "apple, banana, orange"
    ansible.builtin.debug:
      msg: "Fruits: {{ fruits | split(',') }}"

  - name: convert map to list
    vars:
      course:
        name: ansible 
        duration: 10 hrs
        trainer: sivakumar
    ansible.builtin.debug:
      msg: "Course info: {{ course | dict2items }}"

  - name: convert list to map
    vars:
      course:
      - {'key': 'name', 'value': 'ansible'}
      - {'key': 'duration', 'value': '10 hrs'}
      - {'key': 'trainer', 'value': 'sivakumar'}
    ansible.builtin.debug:
      msg: "Course info: {{ course | items2dict }}"

  - name: convert lower to upper
    vars:
      name: "Rama Krishna"
    ansible.builtin.debug:
      msg: "Hello {{ name | upper }}"

  - name: convert upper to lower
    vars:
      name: "Rama Krishna"
    ansible.builtin.debug:
      msg: "Hello {{ name | lower }}"

  - name: print min & max
    vars:
     numbers: [1,10,30,50,100]
    ansible.builtin.debug:
      msg: "Min is {{ numbers | min }} & Max is {{ numbers | max }}"

  - name: validate ip address
    vars:
      ip: 235.245.231.22
    ansible.builtin.debug:
      msg: "{{ ip | ansible.utils.ipaddr }}"