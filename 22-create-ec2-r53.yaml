- name: create ec2 instances & r53 records
  connection: local
  hosts: local
  vars:
    subnet_id: subnet-094cc3fcccfe05ee0
    sg_id: sg-01a3e7629b59a31b6
    ami_id: ami-0220d79f3f480ecf5
    instance_type: t3.micro
    instances:
    - mysql
    - backend
    - frontend
  tasks:
  - name: install aws python libraries
    ansible.builtin.pip:
      name: "{{ item }}"
      executable: pip3.9 
    loop:
    - boto3
    - botocore
  - name: create ec2 instances
    amazon.aws.ec2_instance:
      name: "{{ item }}"
      subnet_id: "{{ subnet_id }}"
      security_group: "{{ sg_id }}"
      image_id: "{{ ami_id }}"
      instance_type: "{{ instance_type }}"
      region: us-east-1
    loop: "{{ instances }}"
    register: ec2_info

  - name: print ec2 instances info
    ansible.builtin.debug:
      msg: "{{ ec2_info }}"


