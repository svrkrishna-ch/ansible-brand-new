- name: DevOps course information
  hosts: local
  connection: local
  vars:
    course_name: "DevOps with AWS"
    duration: 120
    topics:
    - linux
    - ansible
    - docker
    - git
    live: true
    tools:
      ci: jenkins
      cloud: AWS
      containerization: docker
  tasks:
  - name: print course information
    ansible.builtin.debug:
      msg: "Hello, Iam learning {{ course_name }} course, its duration is {{ duration }} hours. Is it live? - {{ live }}. Topics covered are {{ topics }}, tools used are {{ tools }}"